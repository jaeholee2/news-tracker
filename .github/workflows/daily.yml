name: Daily news update

# Runs once a day even if your laptop is off, then publishes the result to
# Cloudflare Pages. See README.md "Cloudflare Pages로 배포하기" for one-time
# setup (repo secrets, Cloudflare Pages project).

on:
  schedule:
    # 23:00 UTC = 08:00 KST (Asia/Seoul). Cron is always UTC; adjust here if
    # you want a different local run time.
    - cron: "0 23 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # to commit the day's data/ + output/archive/ back to the repo
  deployments: write # for the Cloudflare Pages deploy step below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect, dedupe, render
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # config.yaml (with real credentials) is gitignored and never
          # committed -- CI uses this secrets-free config file instead and
          # gets the Naver credentials from the env vars above.
          NEWS_TRACKER_CONFIG_PATH: config.ci.yaml
        run: python -m news_tracker.main

      - name: Commit updated data & archive
        run: |
          git config user.name "news-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- data output
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%Y-%m-%d)"
          git push

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Creates the project on the very first run only; on later runs
          # it already exists, so this step's failure is expected and safe
          # to ignore.
          npx --yes wrangler@4 pages project create news-tracker --production-branch=main || true
          npx --yes wrangler@4 pages deploy ./output --project-name=news-tracker --branch=main
