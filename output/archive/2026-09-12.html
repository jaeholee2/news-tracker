<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Tracker &ndash; 2026-09-12</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root {
    --fg: #15171c;
    --fg-2: #374151;
    --muted: #6b7280;
    --faint: #9ca3af;
    --line: #e5e7eb;
    --line-soft: #eef0f3;
    --chip: #f0f1f4;
    --tag: #f3f4f6;
    --accent: #1b68e0;
    --accent-dark: #1454bc;
    --accent-soft: #e8f0fd;
    --accent-line: #b9d2f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: var(--fg);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo",
      "Malgun Gothic", "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: #d6e4fb; }
  a { color: var(--fg); text-decoration: none; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 28px; }

  /* ---- top bar ---- */
  .topbar { border-bottom: 1px solid var(--line); }
  .topbar .wrap { height: 56px; display: flex; align-items: center; gap: 22px; }
  .logo { font-size: 17px; font-weight: 800; letter-spacing: -0.04em; color: var(--accent); }
  .logo a { color: inherit; }
  .vr { width: 1px; height: 18px; background: var(--line); }
  .section-name { font-size: 14.5px; font-weight: 600; color: var(--fg-2); }
  .stamp {
    margin-left: auto; font-size: 12.5px; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* ---- archive tabs ---- */
  .archive-row { display: flex; align-items: center; gap: 8px; padding-top: 18px; overflow-x: auto; }
  .archive-row .row-label {
    flex: 0 0 auto; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-right: 4px;
  }
  .archive-row a, .archive-row .current {
    flex: 0 0 auto; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    font-variant-numeric: tabular-nums; border: 1px solid var(--line); color: var(--muted);
  }
  .archive-row a:hover { border-color: var(--accent-line); color: var(--accent); }
  .archive-row .current {
    background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent);
  }

  /* ---- keyword pills ---- */
  .kw-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding-top: 26px; }
  .kw-row .lead { font-size: 15px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px;
    font: inherit; font-size: 14px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap;
    color: var(--fg-2); background: var(--chip); border: none; border-radius: 999px; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .pill .count { opacity: 0.6; font-variant-numeric: tabular-nums; }
  .pill:hover { background: #e6e8ec; }
  .pill[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .pill[aria-pressed="true"]:hover { background: var(--accent-dark); }

  /* ---- source filter ---- */
  .src-row { padding-top: 14px; }
  .src-row-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .src-row-head .row-label { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-right: 4px; }
  .source-chips {
    display: flex; flex-wrap: wrap; gap: 8px; overflow: hidden;
    transition: max-height 0.2s ease;
  }
  .src-chip {
    padding: 5px 12px; font: inherit; font-size: 12px; font-weight: 600; color: var(--muted);
    background: #fff; border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
  }
  .src-chip:hover { border-color: var(--accent-line); color: var(--accent); }
  .src-chip[aria-pressed="true"] {
    color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line);
  }
  .src-toggle-btn {
    margin-top: 8px; padding: 0; font: inherit; font-size: 12.5px; font-weight: 600;
    color: var(--accent); background: none; border: none; cursor: pointer;
  }
  .src-toggle-btn:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ---- summary line ---- */
  .summary-row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 10px; padding-top: 18px; font-size: 12.5px; color: var(--muted);
  }
  .summary-row b { color: var(--accent); font-variant-numeric: tabular-nums; }
  .summary-row b.plain { color: var(--fg-2); }
  .summary-row .actions { display: flex; gap: 14px; }
  .link-btn {
    padding: 0; font: inherit; font-size: 12.5px; color: var(--muted); background: none;
    border: none; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }
  .link-btn:hover { color: var(--accent); }
  .link-btn.accent { color: var(--accent); }

  /* ---- groups + cards ---- */
  main.wrap { padding-top: 24px; padding-bottom: 90px; display: flex; flex-direction: column; gap: 44px; }
  .group-head { display: flex; align-items: center; gap: 10px; padding-bottom: 16px; }
  .group-head .bar { width: 4px; height: 17px; border-radius: 2px; background: var(--kw-color); }
  .group-head h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.035em; }
  .group-head .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  ul.cards {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 32px 26px;
  }
  ul.cards li {
    display: flex; flex-direction: column; gap: 11px; min-width: 0;
    transition: opacity 0.2s ease;
  }
  .thumb {
    position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
    background: repeating-linear-gradient(135deg, #edeff2 0 8px, #f5f6f8 8px 16px);
  }
  .thumb img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  a.title {
    font-size: 16.5px; font-weight: 700; line-height: 1.42; letter-spacing: -0.03em;
    text-wrap: pretty; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; min-height: calc(1.42em * 3);
  }
  a.title:hover { color: var(--accent); }
  .card-meta {
    margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px;
  }
  .card-meta .src { font-weight: 700; color: var(--fg-2); }
  .card-meta .tag {
    padding: 2px 8px; background: var(--tag); border-radius: 4px; color: var(--muted); font-size: 11.5px;
  }
  .card-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 12px; color: var(--muted);
  }
  .card-foot time { font-variant-numeric: tabular-nums; }
  .read-toggle {
    padding: 3px 10px; font: inherit; font-size: 11.5px; font-weight: 600; color: var(--muted);
    background: #fff; border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
    white-space: nowrap;
  }
  .read-toggle:hover { color: var(--accent); border-color: var(--accent-line); }
  li.is-read { opacity: 0.5; }
  li.is-read a.title { text-decoration: line-through; text-decoration-color: #c3c8d0; }
  li.is-read .read-toggle { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }

  .empty {
    margin: 0; padding: 40px 0; border-top: 1px solid var(--line-soft);
    text-align: center; font-size: 13.5px; color: var(--muted);
  }
  footer.wrap {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;
    padding-top: 8px; font-size: 11.5px; color: var(--muted);
  }
  footer.wrap { border-top: 1px solid var(--line-soft); max-width: 1280px; }

  [hidden] { display: none !important; }

  @media (max-width: 560px) {
    .wrap { padding: 0 18px; }
    ul.cards { grid-template-columns: 1fr; gap: 26px; }
    a.title { font-size: 16px; }
  }
  </style>
</head>

<script>
(function () {
  var palette = ["#0e9f6e", "#1b68e0", "#f05252", "#9061f9", "#c27803"];
  palette.forEach(function (c, i) {
    document.documentElement.style.setProperty("--kw-color-" + i, c);
  });
})();
</script>

<script>
(function () {
  var READ_KEY = "news-tracker-read";
  var items = Array.prototype.slice.call(document.querySelectorAll("ul.cards li"));
  if (!items.length) { return; }

  var state = { kw: null, src: null, read: {} };
  try { state.read = JSON.parse(localStorage.getItem(READ_KEY) || "{}") || {}; } catch (e) {}

  function saveRead() {
    try { localStorage.setItem(READ_KEY, JSON.stringify(state.read)); } catch (e) {}
  }

  // published_at arrives as a UTC ISO string -- show it in the reader's local time.
  items.forEach(function (li) {
    var t = li.querySelector("time");
    if (!t || !t.getAttribute("datetime")) { return; }
    var d = new Date(t.getAttribute("datetime"));
    if (isNaN(d)) { return; }
    var p = function (n) { return String(n).padStart(2, "0"); };
    t.textContent = d.getFullYear() + "." + p(d.getMonth() + 1) + "." + p(d.getDate()) +
      " " + p(d.getHours()) + ":" + p(d.getMinutes());
  });

  var sourceRow = document.getElementById("source-row");
  var sourceChips = document.getElementById("source-chips");
  var srcAll = document.getElementById("src-all");
  var kwAll = document.getElementById("kw-all");
  var kwChips = Array.prototype.slice.call(document.querySelectorAll(".pill[data-kw]"));
  var resetBtn = document.getElementById("reset-filters");
  var clearReadBtn = document.getElementById("clear-read");
  var readCountEl = document.getElementById("read-count");
  var visibleCountEl = document.getElementById("visible-count");
  var kwSelectedEl = document.getElementById("kw-selected");

  var sources = [];
  items.forEach(function (li) {
    var s = li.getAttribute("data-source");
    if (s && sources.indexOf(s) === -1) { sources.push(s); }
  });
  sources.sort();
  sources.forEach(function (name) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "src-chip";
    b.setAttribute("aria-pressed", "false");
    b.setAttribute("data-src", name);
    b.textContent = name;
    b.addEventListener("click", function () {
      state.src = state.src === name ? null : name;
      apply();
    });
    sourceChips.appendChild(b);
  });

  if (sources.length > 1) {
    sourceRow.hidden = false;
    setupSourceToggle();
  }

  // Collapse the publisher chip list to two rows when it's long enough to
  // need it, with a button to expand/collapse -- otherwise a busy day's
  // full source list (dozens of outlets) dominates the page before you
  // even reach the articles.
  function setupSourceToggle() {
    var toggle = document.getElementById("src-toggle");
    var firstChip = sourceChips.querySelector(".src-chip");
    if (!toggle || !firstChip) { return; }
    var rowHeight = firstChip.getBoundingClientRect().height;
    var gap = 8;
    var collapsedHeight = Math.round(rowHeight * 2 + gap);
    if (sourceChips.scrollHeight <= collapsedHeight + 4) { return; } // already fits in two rows

    var collapsed = true;
    sourceChips.style.maxHeight = collapsedHeight + "px";
    toggle.hidden = false;
    toggle.addEventListener("click", function () {
      collapsed = !collapsed;
      sourceChips.style.maxHeight = collapsed ? collapsedHeight + "px" : sourceChips.scrollHeight + "px";
      toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
      toggle.textContent = collapsed ? "언론사 더보기" : "접기";
    });
  }

  srcAll.addEventListener("click", function () { state.src = null; apply(); });
  kwAll.addEventListener("click", function () { state.kw = null; apply(); });
  kwChips.forEach(function (chip) {
    chip.addEventListener("click", function () {
      var kw = chip.getAttribute("data-kw");
      state.kw = state.kw === kw ? null : kw;
      apply();
    });
  });

  items.forEach(function (li) {
    var link = li.getAttribute("data-link");
    li.querySelector(".read-toggle").addEventListener("click", function () {
      if (state.read[link]) { delete state.read[link]; } else { state.read[link] = 1; }
      saveRead();
      apply();
    });
    li.querySelector("a.title").addEventListener("click", function () {
      state.read[link] = 1;
      saveRead();
      apply();
    });
  });

  clearReadBtn.addEventListener("click", function () { state.read = {}; saveRead(); apply(); });
  resetBtn.addEventListener("click", function () { state.kw = null; state.src = null; apply(); });

  function apply() {
    var visible = 0;
    var read = 0;
    var seen = {};

    Array.prototype.forEach.call(document.querySelectorAll("section.keyword-group"), function (section) {
      var kwMatch = !state.kw || section.getAttribute("data-kw") === state.kw;
      section.hidden = !kwMatch;

      var shown = 0;
      Array.prototype.forEach.call(section.querySelectorAll("ul.cards li"), function (li) {
        var link = li.getAttribute("data-link");
        var isRead = !!state.read[link];
        li.classList.toggle("is-read", isRead);
        li.querySelector(".read-toggle").textContent = isRead ? "읽음 해제" : "읽음";

        var srcMatch = !state.src || li.getAttribute("data-source") === state.src;
        var show = kwMatch && srcMatch;
        li.hidden = !show;
        if (show) {
          shown++;
          if (!seen[link]) {
            seen[link] = 1;
            visible++;
            if (isRead) { read++; }
          }
        }
      });

      var countEl = section.querySelector(".group-count");
      if (countEl) { countEl.textContent = shown; }
      var emptyEl = section.querySelector(".group-empty");
      if (emptyEl) { emptyEl.hidden = shown !== 0; }
      var list = section.querySelector("ul.cards");
      if (list) { list.hidden = shown === 0; }
    });

    kwAll.setAttribute("aria-pressed", state.kw ? "false" : "true");
    kwChips.forEach(function (chip) {
      chip.setAttribute("aria-pressed", state.kw === chip.getAttribute("data-kw") ? "true" : "false");
    });
    srcAll.setAttribute("aria-pressed", state.src ? "false" : "true");
    Array.prototype.forEach.call(sourceChips.querySelectorAll(".src-chip"), function (chip) {
      chip.setAttribute("aria-pressed", state.src === chip.getAttribute("data-src") ? "true" : "false");
    });

    if (kwSelectedEl) { kwSelectedEl.textContent = state.kw ? 1 : kwChips.length; }
    resetBtn.hidden = !(state.kw || state.src);
    visibleCountEl.textContent = visible;
    readCountEl.textContent = read;
  }

  apply();
})();
</script>
